<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samuel's Spot</title>
<meta name="description" content="hey Samuel, I saved you a spot.">
<meta property="og:title" content="hey Samuel, I saved you a spot.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#EFF2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111917" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='%23F28B5A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..500,0..100,0..1;1,9..144,300..500,0..100,0..1&display=swap">
<style>
  /* One sentence, set well. The full stop is the spot. */
  :root {
    --ground: #EFF2EE;
    --ink: #172420;
    --spot: #F28B5A;
    --glow: transparent;
    --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111917;
      --ink: #EEF2EE;
      --glow: rgba(242, 139, 90, .5);
    }
  }
  :root[data-theme="dark"] {
    --ground: #111917;
    --ink: #EEF2EE;
    --glow: rgba(242, 139, 90, .5);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage {
    min-height: 100svh;
    display: grid;
    align-content: center;
    padding: clamp(2rem, 8vw, 6rem);
    padding-bottom: calc(clamp(2rem, 8vw, 6rem) + 5vh);
  }
  .line {
    margin: 0;
    max-width: 12em;
    font-weight: 340;
    font-size: clamp(2.4rem, 12vw, 6.5rem);
    line-height: 1.06;
    letter-spacing: -.015em;
    font-optical-sizing: auto;
    font-variation-settings: "SOFT" 100, "WONK" 1;
    text-wrap: pretty;
  }
  .line em {
    font-style: italic;
    font-weight: 320;
  }
  .spot {
    display: inline-block;
    width: .2em;
    height: .2em;
    margin-left: .08em;
    border-radius: 50%;
    background: var(--spot);
    box-shadow: 0 0 .6em var(--glow);
    vertical-align: baseline;
    transform-origin: center;
  }
  .sr {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* Motion: the line settles, the spot lands, then breathes. All from a visible resting state. */
  @media (prefers-reduced-motion: no-preference) {
    .line { animation: settle 1.2s cubic-bezier(.2, .7, .2, 1) both; }
    .spot {
      animation:
        land .9s cubic-bezier(.34, 1.56, .64, 1) .35s both,
        breathe 4.4s ease-in-out 1.3s infinite;
    }
    @keyframes settle { from { transform: translateY(.12em); } to { transform: none; } }
    @keyframes land { from { transform: scale(.55); } to { transform: scale(1); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  }
</style>
</head>
<body>
<main class="stage">
  <p class="line"><em>hey Samuel,</em><br>I saved you a spot<span class="spot" aria-hidden="true"></span><span class="sr">.</span></p>
</main>
</body>
</html>
